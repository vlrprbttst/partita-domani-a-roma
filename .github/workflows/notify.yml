name: Send Match Notifications

on:
  schedule:
    - cron: '0 10 * * *'  # 12:00 Rome (CEST = UTC+2)
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force a test notification to all subscribers (bypasses match check)'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node scripts/send-notifications.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_SEND: ${{ inputs.force_send }}
