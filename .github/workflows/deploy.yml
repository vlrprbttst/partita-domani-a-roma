name: Deploy to GitHub Pages

on:
  push:
    branches: [rewrite-modern]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

      - run: echo "// build $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/sw.js

      - run: node scripts/fetch-matches.js dist/data
        env:
          VITE_FOOTBALL_API_TOKEN: ${{ secrets.VITE_FOOTBALL_API_TOKEN }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
